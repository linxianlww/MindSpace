name: mindspace
description: "MindSpace —— 本地优先、隐私优先的类笔记 App（文本 / 媒体集 / 音频 / 文件 四类铭记）。"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # —— 状态管理与路由 ——
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # —— 数据模型 / 序列化（与 Dart 3.13 匹配的代码生成版本）——
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # —— 本地数据库（drift + 内置 sqlite，原生库支持 arm64-v8a）——
  drift: ^2.35.0
  drift_flutter: ^0.3.0

  # —— 文件系统 / 路径 / UUID ——
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1

  # —— 权限 / 选择 / 分享 / 打开外部 ——
  permission_handler: ^11.3.1
  file_picker: ^8.1.6
  share_plus: ^10.1.4
  open_filex: ^4.5.0
  screenshot: ^3.0.0

  # —— UI：瀑布流 / 富文本 / 图片查看与处理 ——
  flutter_staggered_grid_view: ^0.7.0
  flutter_quill: ^11.0.0
  photo_view: ^0.15.0
  image: ^4.0.0
  image_cropper: ^8.0.0

  # —— 视频 ——
  video_player: ^2.9.2
  chewie: ^1.8.5

  # —— 音频：播放 / 波形（录音由 audio_waveforms 的 RecorderController 承担，
  #    故不再引入未使用且与 Dart 3.13 不兼容的 record 包，避免连带编译 record_linux）——
  just_audio: ^0.9.42
  audio_waveforms: ^1.0.5

  # —— 文档解析 ——
  # 固定 2.4.5：2.4.6+ 的 pdfrx_engine 经 image^4.8 / archive^4 传导，与 excel 锁定的
  # archive 3 冲突；2.4.5 搭配 pdfrx_engine 0.4.4（不依赖 image/archive）可共存，
  # 且已修复 1.3.5 在 Dart 3.13 下的空安全编译错误。下方 dependency_overrides 锁死 engine。
  pdfrx: 2.4.5            # PDF 内置阅读
  excel: ^4.0.6           # XLSX/XLS 解析
  archive: ^3.6.1         # zip / docx(xml+zip) 解包、备份归档
  xml: ^6.5.0             # 自研 DOCX XML 解析（替代已停更的 docx_to_text）

  # —— 设置 / 日志 / 应用信息 / 链接 ——
  shared_preferences: ^2.3.3
  logger: ^2.5.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  dynamic_color: ^1.7.0   # Android 12+ 动态取色（Material You）
  intl: ^0.20.2

# 使用本地修补版 pdfrx_engine 0.4.4：
# 1) 0.4.5+ 经 image^4.8/archive^4 与 excel 锁定的 archive 3 冲突；
# 2) 0.4.4 在 Dart 3.13 下有一处 await 后可空变量类型提升的编译错误，已在
#    third_party/pdfrx_engine 内打补丁（详见该文件注释），故以 path 方式覆盖。
dependency_overrides:
  pdfrx_engine:
    path: third_party/pdfrx_engine
  # pdfium_dart 0.2.5 的 build hook 会在构建时从 github.com 下载 PDFium 原生
  # 库（国内网络常超时）。改为本地版：hook 优先使用 prebuilt/ 内置的 arm64 .so，
  # 完全离线可构建（见 third_party/pdfium_dart/hook/build.dart）。
  pdfium_dart:
    path: third_party/pdfium_dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 代码生成（与 Dart 3.13 / analyzer 匹配）
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.0
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  assets:
    - assets/
